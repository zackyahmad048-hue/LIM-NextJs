openapi: 3.1.0
info:
  title: LIM API — CMS
  version: 1.0.0
  description: Kontrak API modul CMS/Portal.
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: CMS
    description: Kategori dan artikel
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Kirim API key sebagai Bearer token, atau gunakan session cookie
        untuk klien web first-party.
    CookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Session cookie Better Auth (khusus origin first-party).
  schemas:
    CmsCategory:
      type: object
      properties:
        id:
          type: string
        nama:
          type: string
        slug:
          type: string
        urutan:
          type: integer
      required:
        - id
        - nama
        - slug
        - urutan
    CmsArticle:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        excerpt:
          type:
            - string
            - "null"
        content:
          type: string
        coverImageUrl:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        authorId:
          type: string
        categoryId:
          type: string
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - slug
        - excerpt
        - coverImageUrl
        - status
        - authorId
        - categoryId
        - publishedAt
        - createdAt
        - updatedAt
    CmsArticleSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        excerpt:
          type:
            - string
            - "null"
        coverImageUrl:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        authorId:
          type: string
        categoryId:
          type: string
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - slug
        - excerpt
        - coverImageUrl
        - status
        - authorId
        - categoryId
        - publishedAt
        - createdAt
        - updatedAt
    CmsCreateCategoryRequest:
      type: object
      properties:
        nama:
          type: string
          minLength: 2
          maxLength: 100
        slug:
          type: string
          minLength: 2
          maxLength: 100
          pattern: ^[a-z0-9-]+$
        urutan:
          type: integer
          minimum: 0
          default: 0
      required:
        - nama
        - slug
    CmsCreateArticleRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        slug:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z0-9-]+$
        excerpt:
          type: string
          maxLength: 500
        content:
          type: string
          minLength: 10
        categoryId:
          type: string
          minLength: 1
        coverImageUrl:
          type: string
          format: uri
      required:
        - title
        - slug
        - content
        - categoryId
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        code:
          type: string
        requestId:
          type: string
      required:
        - success
  parameters: {}
paths:
  /cms/categories:
    get:
      tags:
        - CMS
      summary: Daftar kategori artikel (publik)
      security: []
      x-lim-auth:
        public: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CmsCategory"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
    post:
      tags:
        - CMS
      summary: Buat kategori
      security: &a1
        - BearerAuth: []
        - CookieAuth: []
      x-lim-auth:
        roles:
          - OWNER
          - CONTENT_MANAGER
        scope: global
        permissions:
          - cms:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsCreateCategoryRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CmsCategory"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cms/articles:
    get:
      tags:
        - CMS
      summary: Daftar artikel
      description: "Publik: hanya PUBLISHED (tanpa content). Admin terautentikasi:
        semua status."
      security: []
      x-lim-auth:
        public: true
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: status
          in: query
        - schema:
            type: string
          required: false
          name: categoryId
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CmsArticleSummary"
                  requestId:
                    type: string
                  code:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - success
                  - data
                  - meta
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - CMS
      summary: Buat artikel (draft)
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - CONTENT_MANAGER
        scope: global
        permissions:
          - cms:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsCreateArticleRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CmsArticle"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cms/articles/{id}:
    get:
      tags:
        - CMS
      summary: Detail artikel by id
      security: []
      x-lim-auth:
        public: true
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CmsArticle"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cms/articles/{id}/publish:
    post:
      tags:
        - CMS
      summary: Publish artikel
      description: Idempotency-Key didukung.
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - CONTENT_MANAGER
        scope: global
        permissions:
          - cms:write
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CmsArticle"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cms/articles/slug/{slug}:
    get:
      tags:
        - CMS
      summary: Detail artikel by slug (publik, PUBLISHED)
      security: []
      x-lim-auth:
        public: true
      parameters:
        - schema:
            type: string
          required: true
          name: slug
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CmsArticle"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
webhooks: {}
