        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Pesantren Ramadan
      summary: Buat penugasan pesantren
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_BIDANG_PESANTREN_RAMADAN
          - PW
