                  - meta
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Pesantren Ramadan
      summary: Buat bank materi
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_BIDANG_PESANTREN_RAMADAN
          - PW
          - PC
          - PENGAJAR_PESANTREN_RAMADAN
        scope: global
        permissions:
          - pesantren:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PesantrenCreateBankMateriRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/PesantrenBankMateri"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pesantren/penugasan:
    get:
      tags:
        - Pesantren Ramadan
      summary: Daftar penugasan pesantren
      security: *a1
      x-lim-auth:
        roles:
