            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: penugasanId
          in: query
        - schema:
            type: string
          required: false
          name: sekolahId
          in: query
        - schema:
            type: string
          required: false
          name: targetJenjang
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
