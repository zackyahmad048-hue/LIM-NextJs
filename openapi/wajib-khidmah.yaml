openapi: 3.1.0
info:
  title: LIM API — Wajib Khidmah
  version: 1.0.0
  description: Kontrak API modul Wajib Khidmah.
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Wajib Khidmah
    description: Penugasan, laporan mingguan, evaluasi kasus & induk
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Kirim API key sebagai Bearer token, atau gunakan session cookie
        untuk klien web first-party.
    CookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Session cookie Better Auth (khusus origin first-party).
  schemas:
    WkPenugasan:
      type: object
      properties:
        id:
          type: string
        guruBantuId:
          type: string
        lembagaId:
          type: string
        dosenPenanggungId:
          type: string
        tanggalMulai:
          type: string
          format: date-time
        tanggalSelesai:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          enum:
            - DIAJUKAN
            - DIAKTIFKAN
            - SELESAI
            - DICABUT
            - DIPERPANJANG
        targetJamaahMingguan:
          type:
            - integer
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - guruBantuId
        - lembagaId
        - dosenPenanggungId
        - tanggalMulai
        - tanggalSelesai
        - status
        - targetJamaahMingguan
        - createdAt
        - updatedAt
    WkLaporan:
      type: object
      properties:
        id:
          type: string
        penugasanId:
          type: string
        pelaporId:
          type: string
        rolePelapor:
          type: string
        namaPengisi:
          type: string
        jabatanPengisi:
          type: string
        periodeMinggu:
          type: integer
        periodeTahun:
          type: integer
        tanggalLapor:
          type: string
          format: date-time
        jumlahHariHadir:
          type: integer
        keteranganAbsensi:
          type:
            - string
            - "null"
        jumlahJamaahDilakukan:
          type: integer
        aktivitasMingguan:
          type: string
        kendala:
          type:
            - string
            - "null"
        statusHonor:
          type: string
          enum:
            - SUDAH_SESUAI
            - BELUM
            - SEBAGIAN
            - TIDAK_BERLAKU
        isForwardedToInduk:
          type: boolean
        createdAt:
          type: string
          format: date-time
        detailKitab:
          type: array
          items:
            type: object
            properties:
              fan:
                type: string
                enum:
                  - NAHWU
                  - SHOROF
                  - FIQIH
                  - HADITS
                  - TAUHID
                  - TAFSIR
                  - AKHLAQ
                  - QURAN_HADITS
                  - LAINNYA
              namaKitab:
                type: string
              frekuensiPertemuan:
                type: integer
            required:
              - fan
              - namaKitab
              - frekuensiPertemuan
      required:
        - id
        - penugasanId
        - pelaporId
        - rolePelapor
        - namaPengisi
        - jabatanPengisi
        - periodeMinggu
        - periodeTahun
        - tanggalLapor
        - jumlahHariHadir
        - keteranganAbsensi
        - jumlahJamaahDilakukan
        - aktivitasMingguan
        - kendala
        - statusHonor
        - isForwardedToInduk
        - createdAt
    WkEvaluasiKasus:
      type: object
      properties:
        id:
          type: string
        penugasanId:
          type: string
        judulMasalah:
          type: string
        deskripsi:
          type: string
        tingkatKeparahan:
          type: string
          enum:
            - RINGAN
            - SEDANG
            - BERAT
        statusMediasi:
          type: string
          enum:
            - MENUNGGU_PUSAT
            - MEDIASI_CABANG
            - EVALUASI_INDUK
            - SELESAI
            - DICABUT
        mediatorId:
          type:
            - string
            - "null"
        catatanMediasi:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - penugasanId
        - judulMasalah
        - deskripsi
        - tingkatKeparahan
        - statusMediasi
        - mediatorId
        - catatanMediasi
        - createdAt
        - updatedAt
    WkEvaluasiInduk:
      type: object
      properties:
        id:
          type: string
        penugasanId:
          type: string
        lembagaId:
          type: string
        evaluatorId:
          type: string
        initiatedById:
          type: string
        catatanEvaluasi:
          type: string
        rekomendasi:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - penugasanId
        - lembagaId
        - evaluatorId
        - initiatedById
        - catatanEvaluasi
        - rekomendasi
        - createdAt
        - updatedAt
    WkSubmitLaporanRequest:
      type: object
      properties:
        penugasanId:
          type: string
          minLength: 1
        periodeMinggu:
          type: integer
          minimum: 1
          maximum: 53
        periodeTahun:
          type: integer
          minimum: 2020
          maximum: 2100
        jumlahHariHadir:
          type: integer
          minimum: 0
          maximum: 7
        keteranganAbsensi:
          type: string
          maxLength: 500
        jumlahJamaahDilakukan:
          type: integer
          minimum: 0
        aktivitasMingguan:
          type: string
          minLength: 10
          maxLength: 2000
        kendala:
          type: string
          maxLength: 1000
        statusHonor:
          type: string
          enum:
            - SUDAH_SESUAI
            - BELUM
            - SEBAGIAN
            - TIDAK_BERLAKU
        detailKitab:
          type: array
          items:
            type: object
            properties:
              fan:
                type: string
                enum:
                  - NAHWU
                  - SHOROF
                  - FIQIH
                  - HADITS
                  - TAUHID
                  - TAFSIR
                  - AKHLAQ
                  - QURAN_HADITS
                  - LAINNYA
              namaKitab:
                type: string
                minLength: 1
                maxLength: 200
              frekuensiPertemuan:
                type: integer
                minimum: 1
            required:
              - fan
              - namaKitab
              - frekuensiPertemuan
      required:
        - penugasanId
        - periodeMinggu
        - periodeTahun
        - jumlahHariHadir
        - jumlahJamaahDilakukan
        - aktivitasMingguan
        - statusHonor
    WkCreateEvaluasiKasusRequest:
      type: object
      properties:
        penugasanId:
          type: string
          minLength: 1
        judulMasalah:
          type: string
          minLength: 3
          maxLength: 200
        deskripsi:
          type: string
          minLength: 10
        tingkatKeparahan:
          type: string
          enum:
            - RINGAN
            - SEDANG
            - BERAT
      required:
        - penugasanId
        - judulMasalah
        - deskripsi
        - tingkatKeparahan
    WkCreateEvaluasiIndukRequest:
      type: object
      properties:
        penugasanId:
          type: string
          minLength: 1
        lembagaId:
          type: string
          minLength: 1
        catatanEvaluasi:
          type: string
          minLength: 10
        rekomendasi:
          type: string
          maxLength: 2000
      required:
        - penugasanId
        - lembagaId
        - catatanEvaluasi
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        code:
          type: string
        requestId:
          type: string
      required:
        - success
  parameters: {}
paths:
  /wajib-khidmah/penugasan:
    get:
      tags:
        - Wajib Khidmah
      summary: Daftar penugasan
      security: &a1
        - BearerAuth: []
        - CookieAuth: []
      x-lim-auth:
        roles:
          - OWNER
          - TIM_WAJIB_KHIDMAH
          - PW
          - PC
          - GURU_BANTU
          - LEMBAGA_EKSTERNAL
        scope: global
        permissions:
          - wk:read
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: status
          in: query
        - schema:
            type: string
          required: false
          name: guruBantuId
          in: query
        - schema:
            type: string
          required: false
          name: lembagaId
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WkPenugasan"
                  requestId:
                    type: string
                  code:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - success
                  - data
                  - meta
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wajib-khidmah/penugasan/{id}:
    get:
      tags:
        - Wajib Khidmah
      summary: Detail penugasan
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - TIM_WAJIB_KHIDMAH
          - PW
          - PC
          - GURU_BANTU
          - LEMBAGA_EKSTERNAL
        scope: global
        permissions:
          - wk:read
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WkPenugasan"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wajib-khidmah/laporan:
    get:
      tags:
        - Wajib Khidmah
      summary: Daftar laporan mingguan
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - TIM_WAJIB_KHIDMAH
          - PW
          - PC
          - GURU_BANTU
          - LEMBAGA_EKSTERNAL
        scope: global
        permissions:
          - wk:read
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: penugasanId
          in: query
        - schema:
            type:
              - integer
              - "null"
          required: false
          name: periodeMinggu
          in: query
        - schema:
            type:
              - integer
              - "null"
          required: false
          name: periodeTahun
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WkLaporan"
                  requestId:
                    type: string
                  code:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - success
                  - data
                  - meta
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Wajib Khidmah
      summary: Submit laporan mingguan
      description: Untuk GURU_BANTU/LEMBAGA_EKSTERNAL. Identitas pengisi akun
        organisasi diturunkan server. Mendukung Idempotency-Key.
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - TIM_WAJIB_KHIDMAH
          - PW
          - PC
          - GURU_BANTU
          - LEMBAGA_EKSTERNAL
        scope: global
        permissions:
          - wk:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WkSubmitLaporanRequest"
      responses:
        "201":
          description: Laporan dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WkLaporan"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wajib-khidmah/laporan/{id}:
    get:
      tags:
        - Wajib Khidmah
      summary: Detail laporan mingguan
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - TIM_WAJIB_KHIDMAH
          - PW
          - PC
          - GURU_BANTU
          - LEMBAGA_EKSTERNAL
        scope: global
        permissions:
          - wk:read
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WkLaporan"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wajib-khidmah/evaluasi-kasus:
    get:
      tags:
        - Wajib Khidmah
      summary: Daftar evaluasi kasus
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - TIM_WAJIB_KHIDMAH
          - PW
          - PC
          - GURU_BANTU
          - LEMBAGA_EKSTERNAL
        scope: global
        permissions:
          - wk:read
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: penugasanId
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WkEvaluasiKasus"
                  requestId:
                    type: string
                  code:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - success
                  - data
                  - meta
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Wajib Khidmah
      summary: Buat evaluasi kasus
      description: OWNER/TIM_WAJIB_KHIDMAH. Idempotency-Key didukung.
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - TIM_WAJIB_KHIDMAH
          - PW
          - PC
          - GURU_BANTU
          - LEMBAGA_EKSTERNAL
        scope: global
        permissions:
          - wk:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WkCreateEvaluasiKasusRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WkEvaluasiKasus"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wajib-khidmah/evaluasi-induk:
    get:
      tags:
        - Wajib Khidmah
      summary: Daftar evaluasi induk
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - TIM_WAJIB_KHIDMAH
          - PW
          - PC
          - GURU_BANTU
          - LEMBAGA_EKSTERNAL
        scope: global
        permissions:
          - wk:read
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: penugasanId
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WkEvaluasiInduk"
                  requestId:
                    type: string
                  code:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - success
                  - data
                  - meta
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Wajib Khidmah
      summary: Buat evaluasi induk
      description: OWNER/TIM_WAJIB_KHIDMAH. Idempotency-Key didukung.
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - TIM_WAJIB_KHIDMAH
          - PW
          - PC
          - GURU_BANTU
          - LEMBAGA_EKSTERNAL
        scope: global
        permissions:
          - wk:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WkCreateEvaluasiIndukRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WkEvaluasiInduk"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
webhooks: {}
