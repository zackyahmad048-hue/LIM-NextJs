openapi: 3.1.0
info:
  title: LIM API — Daerah Binaan
  version: 1.0.0
  description: Kontrak API modul Daerah Binaan.
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Daerah Binaan
    description: Daerah binaan dan laporan bulanan
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Kirim API key sebagai Bearer token, atau gunakan session cookie
        untuk klien web first-party.
    CookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Session cookie Better Auth (khusus origin first-party).
  schemas:
    DaerahBinaan:
      type: object
      properties:
        id:
          type: string
        namaLokasi:
          type: string
        provinsi:
          type: string
        kabupaten:
          type: string
        kecamatan:
          type: string
        deskripsiKondisi:
          type: string
        sumberLokasi:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - DIAJUKAN
            - AKTIF
            - LULUS_GRADUASI
            - NON_AKTIF
        picLokalId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - namaLokasi
        - provinsi
        - kabupaten
        - kecamatan
        - deskripsiKondisi
        - sumberLokasi
        - status
        - picLokalId
        - createdAt
        - updatedAt
    LaporanBulananBinaan:
      type: object
      properties:
        id:
          type: string
        daerahBinaanId:
          type: string
        pelaporId:
          type: string
        bulan:
          type: integer
        tahun:
          type: integer
        tanggalLapor:
          type: string
          format: date-time
        kegiatanDilakukan:
          type: string
        jumlahPesertaEstimasi:
          type:
            - integer
            - "null"
        dampakNaratif:
          type: string
        tantanganHambatan:
          type:
            - string
            - "null"
        rencanaBulanDepan:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - daerahBinaanId
        - pelaporId
        - bulan
        - tahun
        - tanggalLapor
        - kegiatanDilakukan
        - jumlahPesertaEstimasi
        - dampakNaratif
        - tantanganHambatan
        - rencanaBulanDepan
        - createdAt
    CreateDaerahBinaanRequest:
      type: object
      properties:
        namaLokasi:
          type: string
          minLength: 3
          maxLength: 200
        provinsi:
          type: string
          minLength: 2
        kabupaten:
          type: string
          minLength: 2
        kecamatan:
          type: string
          minLength: 2
        deskripsiKondisi:
          type: string
          minLength: 10
        sumberLokasi:
          type: string
          maxLength: 200
      required:
        - namaLokasi
        - provinsi
        - kabupaten
        - kecamatan
        - deskripsiKondisi
    CreateLaporanBulananBinaanRequest:
      type: object
      properties:
        daerahBinaanId:
          type: string
          minLength: 1
        bulan:
          type: integer
          minimum: 1
          maximum: 12
        tahun:
          type: integer
          minimum: 2020
          maximum: 2100
        kegiatanDilakukan:
          type: string
          minLength: 10
        jumlahPesertaEstimasi:
          type: integer
          minimum: 0
        dampakNaratif:
          type: string
          minLength: 10
        tantanganHambatan:
          type: string
          maxLength: 2000
        rencanaBulanDepan:
          type: string
          maxLength: 2000
      required:
        - daerahBinaanId
        - bulan
        - tahun
        - kegiatanDilakukan
        - dampakNaratif
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        code:
          type: string
        requestId:
          type: string
      required:
        - success
  parameters: {}
paths:
  /daerah-binaan/daerah:
    get:
      tags:
        - Daerah Binaan
      summary: Daftar daerah binaan
      security: &a1
        - BearerAuth: []
        - CookieAuth: []
      x-lim-auth:
        roles:
          - OWNER
          - PW
          - PC
        scope: global
        permissions:
          - daerah_binaan:read
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: status
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DaerahBinaan"
                  requestId:
                    type: string
                  code:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - success
                  - data
                  - meta
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Daerah Binaan
      summary: Ajukan daerah binaan
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - PW
          - PC
        scope: global
        permissions:
          - daerah_binaan:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDaerahBinaanRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/DaerahBinaan"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /daerah-binaan/laporan:
    get:
      tags:
        - Daerah Binaan
      summary: Daftar laporan bulanan binaan
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - PW
          - PC
        scope: global
        permissions:
          - daerah_binaan:read
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: daerahBinaanId
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LaporanBulananBinaan"
                  requestId:
                    type: string
                  code:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - success
                  - data
                  - meta
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Daerah Binaan
      summary: Buat laporan bulanan binaan
      description: Idempotency-Key didukung.
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - PW
          - PC
        scope: global
        permissions:
          - daerah_binaan:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLaporanBulananBinaanRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/LaporanBulananBinaan"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
webhooks: {}
