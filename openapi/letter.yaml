openapi: 3.1.0
info:
  title: LIM API — Letters
  version: 1.0.0
  description: Kontrak API modul persuratan (letter).
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Letters
    description: Persuratan
  - name: Uploads
    description: Upload lampiran (presign R2/S3)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Kirim API key sebagai Bearer token, atau gunakan session cookie
        untuk klien web first-party.
    CookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Session cookie Better Auth (khusus origin first-party).
  schemas:
    Letter:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - MASUK
            - KELUAR
        nomorSurat:
          type:
            - string
            - "null"
        tanggalSurat:
          type: string
          format: date-time
        pengirim:
          type: string
        penerima:
          type:
            - string
            - "null"
        perihal:
          type: string
        isiSurat:
          type:
            - string
            - "null"
        fileUrl:
          type:
            - string
            - "null"
        qrCodeUrl:
          type:
            - string
            - "null"
        verificationSlug:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - DIKETIK
            - REVIEW
            - APPROVED
            - SENT
            - ARCHIVED
        createdById:
          type: string
        periodId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - nomorSurat
        - tanggalSurat
        - pengirim
        - penerima
        - perihal
        - fileUrl
        - qrCodeUrl
        - verificationSlug
        - status
        - createdById
        - periodId
        - createdAt
        - updatedAt
    LetterSummary:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - MASUK
            - KELUAR
        nomorSurat:
          type:
            - string
            - "null"
        tanggalSurat:
          type: string
          format: date-time
        pengirim:
          type: string
        penerima:
          type:
            - string
            - "null"
        perihal:
          type: string
        fileUrl:
          type:
            - string
            - "null"
        qrCodeUrl:
          type:
            - string
            - "null"
        verificationSlug:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - DIKETIK
            - REVIEW
            - APPROVED
            - SENT
            - ARCHIVED
        createdById:
          type: string
        periodId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - nomorSurat
        - tanggalSurat
        - pengirim
        - penerima
        - perihal
        - fileUrl
        - qrCodeUrl
        - verificationSlug
        - status
        - createdById
        - periodId
        - createdAt
        - updatedAt
    LetterLog:
      type: object
      properties:
        id:
          type: string
        letterId:
          type: string
        action:
          type: string
          enum:
            - DIKETIK
            - REVIEW
            - APPROVED
            - SENT
            - ARCHIVED
        userId:
          type: string
        notes:
          type:
            - string
            - "null"
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - letterId
        - action
        - userId
        - notes
        - timestamp
    CreateLetterRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - MASUK
            - KELUAR
          default: KELUAR
        pengirim:
          type: string
          minLength: 2
          maxLength: 200
        penerima:
          type:
            - string
            - "null"
          maxLength: 200
        perihal:
          type: string
          minLength: 3
          maxLength: 500
        isiSurat:
          type: string
          minLength: 10
      required:
        - pengirim
        - perihal
        - isiSurat
    UpdateLetterRequest:
      type: object
      properties:
        pengirim:
          type: string
          minLength: 2
          maxLength: 200
        penerima:
          type:
            - string
            - "null"
          maxLength: 200
        perihal:
          type: string
          minLength: 3
          maxLength: 500
        isiSurat:
          type: string
          minLength: 10
        fileUrl:
          type:
            - string
            - "null"
          format: uri
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        code:
          type: string
        requestId:
          type: string
      required:
        - success
    UploadPresignRequest:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
        size:
          type: integer
          exclusiveMinimum: 0
        purpose:
          type: string
          enum:
            - letter-attachment
          default: letter-attachment
      required:
        - contentType
        - size
    UploadPresignResponse:
      type: object
      properties:
        key:
          type: string
        uploadUrl:
          type: string
          format: uri
        expiresIn:
          type: integer
        method:
          type: string
          enum:
            - PUT
        headers:
          type: object
          additionalProperties:
            type: string
        maxBytes:
          type: integer
      required:
        - key
        - uploadUrl
        - expiresIn
        - method
        - headers
        - maxBytes
  parameters: {}
paths:
  /letters:
    get:
      tags:
        - Letters
      summary: Daftar surat
      description: Mengembalikan daftar surat sesuai scope role (paginasi offset).
      security: &a1
        - BearerAuth: []
        - CookieAuth: []
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
          - ADMIN_BIDANG_SAFARI
          - ADMIN_BIDANG_PESANTREN_RAMADAN
          - PW
          - PC
        scope: global
        permissions:
          - letters:read
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
            enum:
              - DIKETIK
              - REVIEW
              - APPROVED
              - SENT
              - ARCHIVED
          required: false
          name: status
          in: query
        - schema:
            type: string
            enum:
              - MASUK
              - KELUAR
          required: false
          name: type
          in: query
        - schema:
            type: string
          required: false
          name: q
          in: query
      responses:
        "200":
          description: Daftar surat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LetterSummary"
                  requestId:
                    type: string
                  code:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - success
                  - data
                  - meta
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Letters
      summary: Buat surat
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
          - ADMIN_BIDANG_SAFARI
          - ADMIN_BIDANG_PESANTREN_RAMADAN
          - PW
          - PC
        scope: global
        permissions:
          - letters:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLetterRequest"
      responses:
        "201":
          description: Surat dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Letter"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /letters/{id}:
    get:
      tags:
        - Letters
      summary: Detail surat
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
          - ADMIN_BIDANG_SAFARI
          - ADMIN_BIDANG_PESANTREN_RAMADAN
          - PW
          - PC
        scope: global
        permissions:
          - letters:read
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Detail surat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Letter"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Letters
      summary: Ubah surat (DIKETIK)
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
          - PW
          - PC
        scope: global
        permissions:
          - letters:write
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLetterRequest"
      responses:
        "200":
          description: Surat diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Letter"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Letters
      summary: Hapus surat (soft delete)
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
        scope: global
        permissions:
          - letters:write
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Surat dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                    required:
                      - id
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /letters/{id}/submit:
    post:
      tags:
        - Letters
      summary: Kirim ke review
      description: Transisi DIKETIK → REVIEW. Mendukung header Idempotency-Key
        (opsional, 8–128 karakter).
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
          - PW
          - PC
        scope: global
        permissions:
          - letters:write
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Surat masuk review
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Letter"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict / in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /letters/{id}/approve:
    post:
      tags:
        - Letters
      summary: Setujui surat
      description: Transisi REVIEW → APPROVED. Mendukung header Idempotency-Key (opsional).
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
        scope: global
        permissions:
          - letters:write
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Surat disetujui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Letter"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /letters/{id}/send:
    post:
      tags:
        - Letters
      summary: Kirim surat (terbitkan nomor)
      description: Transisi ke SENT dan generate nomor surat. Mendukung header
        Idempotency-Key (disarankan).
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
        scope: global
        permissions:
          - letters:write
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Surat terkirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Letter"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /letters/{id}/logs:
    get:
      tags:
        - Letters
      summary: Log surat
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
          - ADMIN_BIDANG_SAFARI
          - ADMIN_BIDANG_PESANTREN_RAMADAN
          - PW
          - PC
        scope: global
        permissions:
          - letters:read
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Log surat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LetterLog"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /uploads/presign:
    post:
      tags:
        - Uploads
      summary: Buat presigned upload URL (R2/S3)
      description: Mengembalikan URL upload sementara (1 jam). Mendukung header
        Idempotency-Key (opsional).
      security: *a1
      x-lim-auth:
        roles:
          - OWNER
          - ADMIN_SEKRETARIAT
          - ADMIN_BIDANG_SAFARI
          - ADMIN_BIDANG_PESANTREN_RAMADAN
          - PW
          - PC
        scope: global
        permissions:
          - uploads:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPresignRequest"
      responses:
        "201":
          description: Presign dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/UploadPresignResponse"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
webhooks: {}
