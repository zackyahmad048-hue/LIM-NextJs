openapi: 3.1.0
info:
  title: LIM API — Public
  version: 1.0.0
  description: Endpoint publik.
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Public
    description: Verifikasi surat dan endpoint publik lain
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Kirim API key sebagai Bearer token, atau gunakan session cookie
        untuk klien web first-party.
    CookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Session cookie Better Auth (khusus origin first-party).
  schemas:
    PublicLetterVerification:
      type: object
      properties:
        nomorSurat:
          type:
            - string
            - "null"
        perihal:
          type: string
        pengirim:
          type: string
        tanggalSurat:
          type: string
          format: date-time
        status:
          type: string
      required:
        - nomorSurat
        - perihal
        - pengirim
        - tanggalSurat
        - status
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        code:
          type: string
        requestId:
          type: string
      required:
        - success
  parameters: {}
paths:
  /public/letters/verify/{slug}:
    get:
      tags:
        - Public
      summary: Verifikasi surat via QR/slug (publik)
      security: []
      x-lim-auth:
        public: true
      parameters:
        - schema:
            type: string
          required: true
          name: slug
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/PublicLetterVerification"
                  requestId:
                    type: string
                  code:
                    type: string
                required:
                  - success
                  - data
        "404":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
webhooks: {}
